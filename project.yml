# The Mac App Store build. build.sh stays the everyday loop and the GitHub
# release; this exists because the store wants an archive Xcode made.
#
# Regenerate Tilt.xcodeproj with `xcodegen generate` after editing this file.
# Info.plist and the entitlements are referenced, never generated: XcodeGen's
# `info:` and `entitlements:` keys would rewrite them, and they are the files
# build.sh signs with too.
#
# No TILT_TEST_HOOK in any configuration. The test hook is build.sh --test only.
name: Tilt
options:
  deploymentTarget:
    macOS: "14.0"
targets:
  Tilt:
    type: application
    platform: macOS
    sources:
      - main.swift
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: AppIcon.icns
        buildPhase: resources
        optional: true # generated by makeicns.sh, and gitignored
      - path: MenuIcon.svg
        buildPhase: resources
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
    preBuildScripts:
      - name: Make AppIcon.icns
        script: ./makeicns.sh
        outputFiles: [$(SRCROOT)/AppIcon.icns]
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: Tilt
        PRODUCT_BUNDLE_IDENTIFIER: io.sxong.tilt
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/Tilt.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # until the developer account is approved
        ENABLE_HARDENED_RUNTIME: YES
        ARCHS: arm64
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        # makeicns.sh writes into the source tree and a temp dir, which the
        # script sandbox refuses.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
